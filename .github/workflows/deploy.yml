name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write lets the job request a GitHub OIDC token for AWS
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: deploylog-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      - name: Record deployment
        run: |
          api_url="$(terraform output -raw api_url)"
          payload=$(printf '{"service":"deploylog","version":"%s","commit":"%s","environment":"prod","deployed_by":"%s"}' \
            "${GITHUB_SHA::7}" "$GITHUB_SHA" "$GITHUB_ACTOR")
          curl --fail-with-body -sS -X POST "$api_url/deployments" \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            -H "content-type: application/json" \
            -d "$payload"
